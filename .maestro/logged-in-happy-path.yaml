appId: vip.chi_chi.pawify.dev
---
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Android app compatibility"
    commands:
      - tapOn: "Don't show again"
- extendedWaitUntil:
    visible: "Email"
    timeout: 15000
- tapOn: "Don't have an account? Sign Up"
- extendedWaitUntil:
    visible: "Confirm Password"
    timeout: 15000
- tapOn: "Email"
- inputText: ${E2E_EMAIL}
- tapOn: "Password"
- inputText: "Pawify-e2e-password-123"
- tapOn: "Confirm Password"
- inputText: "Pawify-e2e-password-123"
- hideKeyboard
- tapOn: "Sign Up"
- extendedWaitUntil:
    visible: "Search artists"
    timeout: 30000
- tapOn:
    point: "38%,95%"
- extendedWaitUntil:
    visible: "No favorite artists"
    timeout: 15000
- tapOn:
    point: "63%,95%"
- extendedWaitUntil:
    visible: "No new releases"
    timeout: 15000
- tapOn:
    point: "88%,95%"
- extendedWaitUntil:
    visible: "Sign Out"
    timeout: 15000
- tapOn: "Sign Out"
- extendedWaitUntil:
    visible: "Email"
    timeout: 15000
