services:
    pawify:
        build:
            context: ../..
            dockerfile: apps/server/Dockerfile
            target: build
        working_dir: /repo/apps/server
        command: npm run dev
        volumes:
            - ./src:/repo/apps/server/src
            - ./package.json:/repo/apps/server/package.json
            - ./tsconfig.json:/repo/apps/server/tsconfig.json
            - ./tsconfig.test.json:/repo/apps/server/tsconfig.test.json
            - ../../packages/shared/src:/repo/packages/shared/src
            - ../../packages/shared/index.ts:/repo/packages/shared/index.ts
            - ${PAWIFY_SECRETS_DIR:-./secrets/local}:/var/pawify/secrets:ro
        environment:
            NODE_ENV: development
            PORT: 10000
        depends_on:
            pawify-dapr:
                condition: service_started
            redis:
                condition: service_healthy
        networks:
            - pawify-net
