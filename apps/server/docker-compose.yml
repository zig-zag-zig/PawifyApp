name: ${COMPOSE_PROJECT_NAME:-pawify}

x-pawify-logging: &pawify-logging
    driver: local
    options:
        max-size: ${PAWIFY_LOG_MAX_SIZE:-2m}
        max-file: ${PAWIFY_LOG_MAX_FILE:-30}
        compress: ${PAWIFY_LOG_COMPRESS:-true}

services:
    pawify:
        build:
            context: ../..
            dockerfile: apps/server/Dockerfile
        image: ${PAWIFY_IMAGE:-pawify:local}
        restart: unless-stopped
        logging: *pawify-logging
        mem_limit: ${PAWIFY_APP_MEMORY_LIMIT:-512m}
        memswap_limit: ${PAWIFY_APP_MEMORY_SWAP_LIMIT:-768m}
        mem_reservation: ${PAWIFY_APP_MEMORY_RESERVATION:-128m}
        cpus: ${PAWIFY_APP_CPUS:-1.0}
        pids_limit: ${PAWIFY_APP_PIDS_LIMIT:-256}
        env_file:
            - ${PAWIFY_ENV_FILE:-.env}
        environment:
            PORT: ${PORT:-10000}
            DAPR_HTTP_ENDPOINT: http://pawify-dapr:${DAPR_HTTP_PORT:-3500}
            NODE_OPTIONS: ${PAWIFY_NODE_OPTIONS:---max-old-space-size=384}
        expose:
            - '${PORT:-10000}'
        ports:
            - '${PAWIFY_HOST_BIND_ADDRESS:-127.0.0.1}:${PAWIFY_HOST_PORT:-3001}:${PORT:-10000}'
        volumes:
            - ${PAWIFY_SECRETS_DIR:-./secrets}:/var/pawify/secrets:ro
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'node -e "fetch(''http://127.0.0.1:'' + (process.env.PORT || ''10000'') + ''/v1/health'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
                ]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 20s
        depends_on:
            pawify-dapr:
                condition: service_started
            redis:
                condition: service_healthy
        networks:
            - pawify-net

    pawify-dapr:
        image: daprio/daprd:latest
        restart: unless-stopped
        logging: *pawify-logging
        mem_limit: ${PAWIFY_DAPR_MEMORY_LIMIT:-192m}
        memswap_limit: ${PAWIFY_DAPR_MEMORY_SWAP_LIMIT:-256m}
        mem_reservation: ${PAWIFY_DAPR_MEMORY_RESERVATION:-64m}
        cpus: ${PAWIFY_DAPR_CPUS:-0.5}
        pids_limit: ${PAWIFY_DAPR_PIDS_LIMIT:-128}
        env_file:
            - ${PAWIFY_ENV_FILE:-.env}
        command:
            [
                './daprd',
                '--app-id',
                '${DAPR_APP_ID:-pawify-api}',
                '--app-port',
                '${PORT:-10000}',
                '--app-protocol',
                'http',
                '--app-channel-address',
                'pawify',
                '--dapr-http-port',
                '${DAPR_HTTP_PORT:-3500}',
                '--dapr-grpc-port',
                '${DAPR_GRPC_PORT:-50001}',
                '--resources-path',
                '/components',
                '--config',
                '/configuration/config.yaml',
                '--dapr-listen-addresses',
                '0.0.0.0',
            ]
        volumes:
            - ./dapr/components:/components:ro
            - ./dapr/config.yaml:/configuration/config.yaml:ro
            - ${PAWIFY_SECRETS_DIR:-./secrets}:/var/pawify/secrets:ro
        expose:
            - '${DAPR_HTTP_PORT:-3500}'
            - '${DAPR_GRPC_PORT:-50001}'
        depends_on:
            redis:
                condition: service_healthy
        networks:
            - pawify-net

    redis:
        image: redis:7.4-alpine
        restart: unless-stopped
        logging: *pawify-logging
        mem_limit: ${PAWIFY_REDIS_MEMORY_LIMIT:-192m}
        memswap_limit: ${PAWIFY_REDIS_MEMORY_SWAP_LIMIT:-192m}
        mem_reservation: ${PAWIFY_REDIS_MEMORY_RESERVATION:-64m}
        cpus: ${PAWIFY_REDIS_CPUS:-0.5}
        pids_limit: ${PAWIFY_REDIS_PIDS_LIMIT:-128}
        env_file:
            - ${PAWIFY_ENV_FILE:-.env}
        command:
            - sh
            - -c
            - |
                if [ "$${PAWIFY_REDIS_PERSISTENCE:-true}" = "false" ]; then
                  exec redis-server \
                    --bind 0.0.0.0 \
                    --protected-mode yes \
                    --port 6379 \
                    --requirepass "$$REDIS_PASSWORD" \
                    --maxmemory "$${REDIS_MAXMEMORY:-128mb}" \
                    --maxmemory-policy "$${REDIS_MAXMEMORY_POLICY:-allkeys-lru}" \
                    --appendonly no \
                    --dir /tmp \
                    --dbfilename dump.rdb \
                    --save ""
                fi

                exec redis-server \
                  --bind 0.0.0.0 \
                  --protected-mode yes \
                  --port 6379 \
                  --requirepass "$$REDIS_PASSWORD" \
                  --maxmemory "$${REDIS_MAXMEMORY:-128mb}" \
                  --maxmemory-policy "$${REDIS_MAXMEMORY_POLICY:-allkeys-lru}" \
                  --appendonly yes \
                  --appendfsync everysec \
                  --save 900 1 \
                  --save 300 10 \
                  --save 60 10000 \
                  --dir /data \
                  --dbfilename dump.rdb
        volumes:
            - redis-data:/data
        expose:
            - '6379'
        healthcheck:
            test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
            interval: 10s
            timeout: 5s
            retries: 10
        networks:
            - pawify-net

volumes:
    redis-data:

networks:
    pawify-net: {}
