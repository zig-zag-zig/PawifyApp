appId: vip.chi_chi.pawify
---
# Covers A7: the artist page shows a "Connections" section with a related
# artist (member-of), and tapping it navigates to that artist.
# Fixture-backed: the Aurora fixture lists Nova Fixture as a related artist.

- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Android app compatibility"
    commands:
      - tapOn: "Don't show again"
- extendedWaitUntil:
    visible: "Email"
    timeout: 30000
- tapOn: "Don't have an account? Sign Up"
- extendedWaitUntil:
    visible: "Confirm Password"
    timeout: 15000
- tapOn: "Email"
- inputText: ${E2E_FEATURE_RELATED_EMAIL}
- tapOn: "Password"
- inputText: "Pawify-e2e-password-123"
- tapOn: "Confirm Password"
- inputText: "Pawify-e2e-password-123"
- hideKeyboard
- tapOn: "Sign Up"
- extendedWaitUntil:
    visible: "Search artists"
    timeout: 30000
- tapOn: "Search artists"
- inputText: "aurora"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Aurora Test Ensemble"
    timeout: 30000
- tapOn: "Aurora Test Ensemble"
- extendedWaitUntil:
    visible: "Connections"
    timeout: 30000
- tapOn: "Connections"             # expand the collapsed section
- extendedWaitUntil:
    visible: "Nova Fixture"
    timeout: 15000
- tapOn: "Nova Fixture"
- extendedWaitUntil:
    visible: "Follow"             # related artist page loaded (header + follow)
    timeout: 45000
- pressKey: Back
