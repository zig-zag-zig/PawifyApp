appId: vip.chi_chi.pawify
---
# Covers A8 deep link: a pawify://release-group/<id> link cold-opens the
# ReleaseGroup page and lazy-loads its releases + covers, then Back lands on a
# tab. This is the share-URL entry path.

- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Android app compatibility"
    commands:
      - tapOn: "Don't show again"
- extendedWaitUntil:
    visible: "Email"
    timeout: 30000
- tapOn: "Don't have an account? Sign Up"
- extendedWaitUntil:
    visible: "Confirm Password"
    timeout: 15000
- tapOn: "Email"
- inputText: ${E2E_FEATURE_DEEPLINK_EMAIL}
- tapOn: "Password"
- inputText: "Pawify-e2e-password-123"
- tapOn: "Confirm Password"
- inputText: "Pawify-e2e-password-123"
- hideKeyboard
- tapOn: "Sign Up"
- extendedWaitUntil:
    visible: "Search artists"
    timeout: 30000

# --- Deep link into a release group (warm) ---
# openLink relaunches/resumes the app on the ReleaseGroup page; the page
# lazy-fetches releases because the URL carries only the group id.
- openLink: "pawify://release-group/pawify-e2e-rg-midnight-signals"
- extendedWaitUntil:
    visible: "Midnight Signals"    # the lazy-fetched release inside the group
    timeout: 45000
- assertVisible: "Share"
- pressKey: Back
# Lands back on a tab, not a dead screen
- extendedWaitUntil:
    visible:
        text: "Search artists|No new releases|No favorite artists|Sign Out"
    timeout: 15000

# --- Cold start: kill the app, then open the same deep link ---
- killApp
- openLink: "pawify://release-group/pawify-e2e-rg-midnight-signals"
- extendedWaitUntil:
    visible: "Midnight Signals"
    timeout: 60000
