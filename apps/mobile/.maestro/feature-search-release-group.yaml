appId: vip.chi_chi.pawify
---
# Covers A3 + A8: Releases search tab, release-group results, and tapping a
# result into the ReleaseGroup page (the lazy-fetched releases list).
# Fixture-backed: searching "midnight"/"aurora" returns the fixture release
# group, and the artist/release lookups resolve against fixture data.

- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Android app compatibility"
    commands:
      - tapOn: "Don't show again"
- extendedWaitUntil:
    visible: "Email"
    timeout: 30000
- tapOn: "Don't have an account? Sign Up"
- extendedWaitUntil:
    visible: "Confirm Password"
    timeout: 15000
- tapOn: "Email"
- inputText: ${E2E_FEATURE_SEARCH_EMAIL}
- tapOn: "Password"
- inputText: "Pawify-e2e-password-123"
- tapOn: "Confirm Password"
- inputText: "Pawify-e2e-password-123"
- hideKeyboard
- tapOn: "Sign Up"
- extendedWaitUntil:
    visible: "Search artists"
    timeout: 30000

# --- Releases tab + release-group result row ---
- assertVisible: "Artists"
- assertVisible: "Releases"
- tapOn: "Releases"
- tapOn: "Search releases"        # placeholder follows the active tab
- inputText: "midnight"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Midnight Signals"
    timeout: 30000
# Row shows title + artist + type/year meta
- assertVisible: "Aurora Test Ensemble"

# --- Tap result -> ReleaseGroup page (lazy releases fetch) ---
# The page lazy-fetches the group's releases; the fixture group contains the
# release "Midnight Signals". The Share chip proves we are on the group page.
- tapOn: "Midnight Signals"
- extendedWaitUntil:
    visible: "Share"               # share chip on the release-group card
    timeout: 30000
- assertVisible: "Midnight Signals"  # lazy-fetched release row rendered
- pressKey: Back
- extendedWaitUntil:
    visible: "Search artists"
    timeout: 15000
