appId: vip.chi_chi.pawify
---
# Covers A4 + A8 share chip: the release page shows the "Listen on" pill when a
# streaming link exists, and the Share chip. Tapping Listen opens an external
# URL (which Maestro leaves to the OS), so we assert the button + the
# long-press picker and Cancel, not the external app.
# Fixture-backed: the Midnight Signals release carries a Spotify url-rel.

- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Android app compatibility"
    commands:
      - tapOn: "Don't show again"
- extendedWaitUntil:
    visible: "Email"
    timeout: 30000
- tapOn: "Don't have an account? Sign Up"
- extendedWaitUntil:
    visible: "Confirm Password"
    timeout: 15000
- tapOn: "Email"
- inputText: ${E2E_FEATURE_LISTEN_EMAIL}
- tapOn: "Password"
- inputText: "Pawify-e2e-password-123"
- tapOn: "Confirm Password"
- inputText: "Pawify-e2e-password-123"
- hideKeyboard
- tapOn: "Sign Up"
- extendedWaitUntil:
    visible: "Search artists"
    timeout: 30000
- tapOn: "Search artists"
- inputText: "aurora"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Aurora Test Ensemble"
    timeout: 30000
- tapOn: "Aurora Test Ensemble"
- extendedWaitUntil:
    visible: "Midnight Signals"
    timeout: 30000
- tapOn: "Midnight Signals"
- extendedWaitUntil:
    visible: "Signal Drift"
    timeout: 30000

# --- A4: Listen Now pill + long-press service picker ---
- assertVisible: "Listen on Spotify"
- longPressOn: "Listen on Spotify"
- extendedWaitUntil:
    visible: "Listen on…"
    timeout: 10000
- assertVisible: "Spotify"
- tapOn: "Cancel"

# --- A8: share chip on the release header ---
- assertVisible: "Share"
- pressKey: Back
