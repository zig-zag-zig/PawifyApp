name: Secret diagnostics
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Report secret sizes (no content)
        env:
          A: ${{ secrets.PAWIFY_ENV_FILE_B64 }}
          B: ${{ secrets.PAWIFY_DAPR_SECRETS_JSON_B64 }}
          C: ${{ secrets.PAWIFY_FIREBASE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          echo "ENV_FILE_B64 length: ${#A} first4: ${A:0:4} last4: ${A: -4} contains_newline: $(printf '%s' "$A" | wc -l)"
          echo "DAPR_B64 length: ${#B} first4: ${B:0:4} last4: ${B: -4}"
          echo "FIREBASE_B64 length: ${#C} first4: ${C:0:4} last4: ${C: -4}"
          printf '%s' "$A" | base64 -d >/dev/null 2>&1 && echo "A decodes OK" || echo "A DECODE FAILS"
